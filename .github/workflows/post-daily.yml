name: ExamBloom Instagram and TikTok Auto Marketing

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
      timezone: 'Europe/London'

permissions:
  contents: write

concurrency:
  group: exambloom-daily-marketing
  cancel-in-progress: false

jobs:
  daily-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and publishing dependencies
        run: pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate today's branded promotional image and captions
        env:
          SALES_DESTINATION_URL: ${{ vars.SALES_DESTINATION_URL }}
        run: python bot.py --preview
      - name: Upload generated advert preview
        uses: actions/upload-artifact@v4
        with:
          name: exambloom-promotion-preview
          path: generated/
          retention-days: 7
      - name: Verify Buffer key and connected channels without publishing
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python check_buffer.py
      - name: Publish via Buffer only after activation
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SALES_DESTINATION_URL: ${{ vars.SALES_DESTINATION_URL }}
        run: python buffer_publish.py

name: ExamBloom Daily Auto Marketing

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
      timezone: 'Europe/London'

permissions:
  contents: write

concurrency:
  group: exambloom-daily-marketing
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the generator
        run: python -m py_compile bot.py
      - name: Generate and publish when enabled
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          SALES_DESTINATION_URL: ${{ vars.SALES_DESTINATION_URL }}
          GRAPH_API_VERSION: v26.0
        run: python bot.py --publish
